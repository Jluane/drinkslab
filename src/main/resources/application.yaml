spring:
  main:
    banner-mode: "off"
  application:
    name: drinkslab
  datasource:
    # Para base de datos NO persistente:
    # url: jdbc:h2:mem:drinkslab
    url: jdbc:h2:file:./datos/tienda_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database: h2
    show-sql: false
    hibernate:
      ddl-auto: update
  profiles:
    include: local
logging:
  level:
    root: WARN